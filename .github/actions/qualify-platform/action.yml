name: Qualify one lmpdf release platform
description: Install and exercise the exact frozen lmpdf candidate without publication credentials
inputs:
  artifact_id:
    description: Immutable candidate artifact ID from the trusted broker
    required: true
  parent_run:
    description: Public broker run that owns the artifact
    required: true
  sums_sha256:
    description: Checksum identity verified by the trusted handoff
    required: true
  tag:
    description: Tag from the verified private candidate manifest
    required: true
  host_asset:
    description: Platform host executable in the candidate
    required: true
  layout_asset:
    description: Platform PDF-layout reader in the candidate
    required: true
  name:
    description: Platform label for evidence
    required: true
  python:
    description: Native Python executable for this runner
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 24
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.12'
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.1.8
      with:
        artifact-ids: ${{ inputs.artifact_id }}
        merge-multiple: true
        run-id: ${{ inputs.parent_run }}
        github-token: ${{ github.token }}
        path: draft-assets
    - name: Install lmscript in a runner-local prefix
      shell: bash
      env:
        PYTHON: ${{ inputs.python }}
      run: |
        set -euo pipefail
        npm install --prefix "$RUNNER_TEMP/compiler" --no-save --package-lock=false @lmctl-ai/lmctl@0.2.458
        compiler="$RUNNER_TEMP/compiler/node_modules/.bin/lmscript"
        if [ "$RUNNER_OS" = Windows ]; then compiler="$compiler.cmd"; fi
        echo "LMSCRIPT_BIN=$compiler" >> "$GITHUB_ENV"
        echo "$RUNNER_TEMP/compiler/node_modules/.bin" >> "$GITHUB_PATH"
    - name: Create isolated Python test environment
      shell: bash
      env:
        PYTHON: ${{ inputs.python }}
      run: |
        "$PYTHON" -m venv .test-venv
        if [ "$RUNNER_OS" = Windows ]; then py="$PWD/.test-venv/Scripts/python.exe"; else py="$PWD/.test-venv/bin/python"; fi
        "$py" -m pip install python-docx==1.2.0 openpyxl==3.1.5 python-pptx==1.0.2
        echo "LMPDF_TEST_PYTHON=$py" >> "$GITHUB_ENV"
    - name: Verify the credential-free candidate handoff
      shell: bash
      env:
        EXPECTED_SUMS_SHA: ${{ inputs.sums_sha256 }}
      run: '"$LMPDF_TEST_PYTHON" scripts/check-local-candidate.py draft-assets "$EXPECTED_SUMS_SHA"'
    - name: Stage the exact draft host and layout reader
      shell: bash
      env:
        DRAFT_TAG: ${{ inputs.tag }}
        DRAFT_ASSET: ${{ inputs.host_asset }}
        LMPDF_QUALIFY_TAG: ${{ inputs.tag }}
        PYTHON: ${{ inputs.python }}
      run: |
        set -euo pipefail
        "$PYTHON" scripts/install-draft-host.py --compiler "$LMSCRIPT_BIN" --tag "$DRAFT_TAG" --asset "$DRAFT_ASSET" --candidate draft-assets
        if [[ "$RUNNER_OS" == Windows ]]; then repo_root="$(pwd -W)"; else repo_root="$PWD"; fi
        layout="$repo_root/draft-assets/${{ inputs.layout_asset }}"
        if [[ "$RUNNER_OS" != Windows ]]; then chmod +x "$layout"; fi
        echo "LMPDF_LAYOUT_READER=$layout" >> "$GITHUB_ENV"
        echo "LMPDF_QUALIFY_TAG=$DRAFT_TAG" >> "$GITHUB_ENV"
    - name: Run lmcode host invocation protocol checks
      shell: bash
      run: '"$LMPDF_TEST_PYTHON" tests/host-protocol.py --binary "$LMPDF_BIN"'
    - name: Run invocation protocol, runtime and real-effect suite
      shell: bash
      run: '"$LMPDF_TEST_PYTHON" tests/protocol-runtime.py --binary "$LMPDF_BIN" --skip-example certificate.lms'
    - name: Run legacy shared-XML compatibility and dry checks
      shell: bash
      env:
        DRAFT_TAG: ${{ inputs.tag }}
      run: |
        "$LMPDF_TEST_PYTHON" tests/shared-xml-runtime.py \
          --compiler "$LMSCRIPT_BIN" \
          --binary "$LMPDF_BIN" \
          --example tests/fixtures/certificate-shared-xml.lms \
          --kind pdf \
          --install "github:lmctl-ai/lmpdf@$DRAFT_TAG"
    - name: Run all html-doc corpus vectors and native PDF layout assertions
      shell: bash
      env:
        EVIDENCE_DIR: ${{ runner.temp }}/lmpdf-html-doc-evidence
        DRAFT_TAG: ${{ inputs.tag }}
        PYTHON: ${{ inputs.python }}
      run: |
        "$PYTHON" tests/html-doc-runtime.py \
          --compiler "$LMSCRIPT_BIN" \
          --binary "$LMPDF_BIN" \
          --layout-reader "$LMPDF_LAYOUT_READER" \
          --install "github:lmctl-ai/lmpdf@$DRAFT_TAG" \
          --evidence "$EVIDENCE_DIR"
    - name: Run native hostile-input and dry-safety suite
      shell: bash
      run: '"$LMPDF_TEST_PYTHON" tests/html-doc-safety.py --binary "$LMPDF_BIN"'
    - name: Summarize platform qualification
      if: ${{ always() && !cancelled() }}
      shell: bash
      env:
        DRAFT_TAG: ${{ inputs.tag }}
        PLATFORM_NAME: ${{ inputs.name }}
      run: |
        echo "## $PLATFORM_NAME candidate qualification" >> "$GITHUB_STEP_SUMMARY"
        echo "Tag: $DRAFT_TAG" >> "$GITHUB_STEP_SUMMARY"
        echo "Result: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
