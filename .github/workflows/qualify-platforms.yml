name: Qualify frozen lmpdf platform artifact
run-name: Qualify lmpdf artifact ${{ github.event.client_payload.parent_run_id }}.${{ github.event.client_payload.parent_attempt }} ${{ github.event.client_payload.tag }}
on:
  repository_dispatch:
    types: [lmpdf-qualify-frozen]
permissions:
  contents: read
  actions: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.gate.outputs.tag }}
      failure_control: ${{ steps.gate.outputs.failure_control }}
      sums_sha256: ${{ steps.gate.outputs.sums_sha256 }}
      artifact: ${{ github.event.client_payload.artifact_id }}
      parent_run: ${{ github.event.client_payload.parent_run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.1.8
        with:
          artifact-ids: ${{ github.event.client_payload.artifact_id }}
          merge-multiple: true
          run-id: ${{ github.event.client_payload.parent_run_id }}
          github-token: ${{ github.token }}
          path: draft-assets
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/verify-parent-handoff.py

  qualify-macos-arm64:
    needs: candidate
    name: Qualify macos-arm64
    runs-on: macos-15
    permissions:
      contents: read
      actions: read
    env:
      LMPDF_DISABLE_RENDER: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/qualify-platform
        with:
          artifact_id: ${{ needs.candidate.outputs.artifact }}
          parent_run: ${{ needs.candidate.outputs.parent_run }}
          sums_sha256: ${{ needs.candidate.outputs.sums_sha256 }}
          tag: ${{ needs.candidate.outputs.tag }}
          host_asset: lmpdf-macos-arm64
          layout_asset: lmpdf-layout-macos-arm64
          name: macos-arm64
          python: python3

  integration:
    needs: [candidate, qualify-macos-arm64]
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - { os: macos-15-intel, name: macos-x64, host: lmpdf-macos-x64, layout: lmpdf-layout-macos-x64, python: python3 }
          - { os: ubuntu-24.04, name: linux-x64, host: lmpdf-linux-x64, layout: lmpdf-layout-linux-x64, python: python3 }
          - { os: ubuntu-24.04-arm, name: linux-arm64, host: lmpdf-linux-arm64, layout: lmpdf-layout-linux-arm64, python: python3 }
          - { os: windows-2022, name: windows-x64, host: lmpdf-windows-x64.exe, layout: lmpdf-layout-windows-x64.exe, python: python }
    name: Qualify ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: read
    env:
      LMPDF_DISABLE_RENDER: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/qualify-platform
        with:
          artifact_id: ${{ needs.candidate.outputs.artifact }}
          parent_run: ${{ needs.candidate.outputs.parent_run }}
          sums_sha256: ${{ needs.candidate.outputs.sums_sha256 }}
          tag: ${{ needs.candidate.outputs.tag }}
          host_asset: ${{ matrix.host }}
          layout_asset: ${{ matrix.layout }}
          name: ${{ matrix.name }}
          python: ${{ matrix.python }}

  replay-macos-arm64:
    needs: [candidate, qualify-macos-arm64]
    name: Replay macos-arm64
    runs-on: macos-15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.12' }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.1.8
        with:
          artifact-ids: ${{ needs.candidate.outputs.artifact }}
          merge-multiple: true
          run-id: ${{ needs.candidate.outputs.parent_run }}
          github-token: ${{ github.token }}
          path: draft-assets
      - name: Install pinned lmscript compiler
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/compiler" --no-save --package-lock=false @lmctl-ai/lmctl@0.2.458
          echo "LMSCRIPT_BIN=$RUNNER_TEMP/compiler/node_modules/.bin/lmscript" >> "$GITHUB_ENV"
      - name: Verify candidate and stage the exact draft host
        env:
          EXPECTED_SUMS_SHA: ${{ needs.candidate.outputs.sums_sha256 }}
          DRAFT_TAG: ${{ needs.candidate.outputs.tag }}
          LMPDF_QUALIFY_TAG: ${{ needs.candidate.outputs.tag }}
        run: |
          python3 scripts/check-local-candidate.py draft-assets "$EXPECTED_SUMS_SHA"
          python3 scripts/install-draft-host.py --compiler "$LMSCRIPT_BIN" --tag "$DRAFT_TAG" --asset lmpdf-macos-arm64 --candidate draft-assets
      - name: Compare independent PDF output hashes
        run: python3 scripts/conformance.py --binary "$LMPDF_BIN" --out-dir "$RUNNER_TEMP/lmpdf-replay" --render-only

  replay:
    needs: [candidate, qualify-macos-arm64]
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - { os: macos-15-intel, name: macos-x64, host: lmpdf-macos-x64, python: python3 }
          - { os: ubuntu-24.04, name: linux-x64, host: lmpdf-linux-x64, python: python3 }
          - { os: ubuntu-24.04-arm, name: linux-arm64, host: lmpdf-linux-arm64, python: python3 }
          - { os: windows-2022, name: windows-x64, host: lmpdf-windows-x64.exe, python: python }
    name: Replay ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.12' }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.1.8
        with:
          artifact-ids: ${{ needs.candidate.outputs.artifact }}
          merge-multiple: true
          run-id: ${{ needs.candidate.outputs.parent_run }}
          github-token: ${{ github.token }}
          path: draft-assets
      - name: Install pinned lmscript compiler
        shell: bash
        env:
          PYTHON: ${{ matrix.python }}
        run: |
          npm install --prefix "$RUNNER_TEMP/compiler" --no-save --package-lock=false @lmctl-ai/lmctl@0.2.458
          compiler="$RUNNER_TEMP/compiler/node_modules/.bin/lmscript"
          if [[ "$RUNNER_OS" == Windows ]]; then compiler="$compiler.cmd"; fi
          echo "LMSCRIPT_BIN=$compiler" >> "$GITHUB_ENV"
          echo "LMPDF_TEST_PYTHON=$PYTHON" >> "$GITHUB_ENV"
      - name: Verify candidate and stage the exact draft host
        shell: bash
        env:
          EXPECTED_SUMS_SHA: ${{ needs.candidate.outputs.sums_sha256 }}
          DRAFT_TAG: ${{ needs.candidate.outputs.tag }}
          LMPDF_QUALIFY_TAG: ${{ needs.candidate.outputs.tag }}
          HOST_ASSET: ${{ matrix.host }}
          PYTHON: ${{ matrix.python }}
        run: |
          "$PYTHON" scripts/check-local-candidate.py draft-assets "$EXPECTED_SUMS_SHA"
          "$PYTHON" scripts/install-draft-host.py --compiler "$LMSCRIPT_BIN" --tag "$DRAFT_TAG" --asset "$HOST_ASSET" --candidate draft-assets
      - name: Compare independent PDF output hashes
        shell: bash
        run: |
          "$LMPDF_TEST_PYTHON" scripts/conformance.py --binary "$LMPDF_BIN" --out-dir "$RUNNER_TEMP/lmpdf-replay" --render-only

  compatibility:
    needs: [candidate, qualify-macos-arm64]
    name: Compatibility with legacy public host
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.12' }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.1.8
        with:
          artifact-ids: ${{ needs.candidate.outputs.artifact }}
          merge-multiple: true
          run-id: ${{ needs.candidate.outputs.parent_run }}
          github-token: ${{ github.token }}
          path: draft-assets
      - name: Install current and historical compiler versions
        run: |
          npm install --prefix "$RUNNER_TEMP/compiler" --no-save --package-lock=false @lmctl-ai/lmctl@0.2.458
          npm install --prefix "$RUNNER_TEMP/compiler-v5" --no-save --package-lock=false @lmctl-ai/lmctl@0.2.420
          echo "LMSCRIPT_BIN=$RUNNER_TEMP/compiler/node_modules/.bin/lmscript" >> "$GITHUB_ENV"
          echo "LMCODE_COMPILER_MODULE=$RUNNER_TEMP/compiler/node_modules/@lmctl-ai/lmctl/dist/dsl.js" >> "$GITHUB_ENV"
      - name: Download and verify the legacy public host
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/before"
          gh release download v0.1.62 -R lmctl-ai/lmpdf --pattern lmpdf-linux-x64 --pattern SHA256SUMS --dir "$RUNNER_TEMP/before"
          (cd "$RUNNER_TEMP/before" && sha256sum --check --ignore-missing SHA256SUMS)
          chmod +x "$RUNNER_TEMP/before/lmpdf-linux-x64"
      - name: Install the exact draft candidate without credentials
        env:
          EXPECTED_SUMS_SHA: ${{ needs.candidate.outputs.sums_sha256 }}
          DRAFT_TAG: ${{ needs.candidate.outputs.tag }}
          LMPDF_QUALIFY_TAG: ${{ needs.candidate.outputs.tag }}
        run: |
          python3 scripts/check-local-candidate.py draft-assets "$EXPECTED_SUMS_SHA"
          python3 scripts/install-draft-host.py --compiler "$LMSCRIPT_BIN" --tag "$DRAFT_TAG" --asset lmpdf-linux-x64 --candidate draft-assets
      - name: Compare five same-input operations with the legacy host
        run: python3 tests/protocol-runtime.py --binary "$LMPDF_BIN" --before-binary "$RUNNER_TEMP/before/lmpdf-linux-x64" --before-compiler "$RUNNER_TEMP/compiler-v5/node_modules/.bin/lmscript" --skip-example certificate.lms

  conformance:
    needs: [candidate, qualify-macos-arm64, integration, replay-macos-arm64, replay, compatibility]
    name: Conformance and archival RSS
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.12' }
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y qpdf poppler-utils mupdf-tools default-jre-headless
          scripts/install-verapdf.sh "$PWD/.tools/verapdf"
          scripts/install-poppler.sh "$PWD/.tools/poppler"
          echo "$PWD/.tools/poppler/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.1.8
        with:
          artifact-ids: ${{ needs.candidate.outputs.artifact }}
          merge-multiple: true
          run-id: ${{ needs.candidate.outputs.parent_run }}
          github-token: ${{ github.token }}
          path: draft-assets
      - name: Install pinned lmscript compiler
        run: |
          npm install --prefix "$RUNNER_TEMP/compiler" --no-save --package-lock=false @lmctl-ai/lmctl@0.2.458
          echo "LMSCRIPT_BIN=$RUNNER_TEMP/compiler/node_modules/.bin/lmscript" >> "$GITHUB_ENV"
      - name: Install the exact draft candidate without credentials
        env:
          EXPECTED_SUMS_SHA: ${{ needs.candidate.outputs.sums_sha256 }}
          DRAFT_TAG: ${{ needs.candidate.outputs.tag }}
          LMPDF_QUALIFY_TAG: ${{ needs.candidate.outputs.tag }}
        run: |
          python3 scripts/check-local-candidate.py draft-assets "$EXPECTED_SUMS_SHA"
          python3 scripts/install-draft-host.py --compiler "$LMSCRIPT_BIN" --tag "$DRAFT_TAG" --asset lmpdf-linux-x64 --candidate draft-assets
      - name: Run archival accessibility and deterministic content checks
        run: python3 scripts/conformance.py --binary "$LMPDF_BIN" --out-dir conformance-output --verapdf "$PWD/.tools/verapdf/verapdf"
      - name: Run tagged and untagged 200-page RSS budgets
        run: python3 scripts/benchmark-release.py --binary "$LMPDF_BIN" --platform linux-x64 --output-dir benchmark-output

  deliberate-failure-test:
    needs: [candidate, qualify-macos-arm64, integration, replay-macos-arm64, replay, compatibility, conformance]
    if: ${{ needs.candidate.outputs.failure_control == 'true' && needs.qualify-macos-arm64.result == 'success' && needs.integration.result == 'success' && needs.replay-macos-arm64.result == 'success' && needs.replay.result == 'success' && needs.compatibility.result == 'success' && needs.conformance.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Run the sealed public failure-path control
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## Deliberate public qualification failure
          The platform, replay, compatibility, archival conformance and RSS gates passed. This sealed throwaway now fails exactly one public test.
          SUMMARY
          python3 - <<'PY'
          import unittest
          class FailurePathTest(unittest.TestCase):
              def test_public_draft_is_not_promoted_after_a_test_failure(self):
                  self.fail("deliberate public draft qualification failure")
          unittest.main()
          PY
