name: Qualify private lmpdf draft

on:
  repository_dispatch:
    types: [lmpdf-release-draft]

permissions:
  contents: read

concurrency:
  group: lmpdf-public-release-qualification
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.candidate.outputs.tag }}
      version: ${{ steps.candidate.outputs.version }}
      failure_control: ${{ steps.candidate.outputs.failure_control }}
      artifact: lmpdf-draft-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate dispatch identity and download the public draft
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_TAG: ${{ github.event.client_payload.tag }}
          EXPECTED_SUMS_SHA: ${{ github.event.client_payload.sha256sums_sha256 }}
          DELIBERATE_FAILURE: ${{ github.event.client_payload.deliberate_failure }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DRAFT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$EXPECTED_SUMS_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$DELIBERATE_FAILURE" == true || "$DELIBERATE_FAILURE" == false ]]
          mkdir -p draft-assets
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
            python3 scripts/download-draft-candidate.py "$DRAFT_TAG" "$EXPECTED_SUMS_SHA" draft-assets
          python3 scripts/verify-draft-candidate.py "$DRAFT_TAG" "$EXPECTED_SUMS_SHA" draft-assets
          version="$(python3 -c 'import json; print(json.load(open("draft-assets/RELEASE-MANIFEST.json"))["version"])')"
          echo "tag=$DRAFT_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "failure_control=$DELIBERATE_FAILURE" >> "$GITHUB_OUTPUT"
          echo "Verified lmpdf candidate $DRAFT_TAG ($EXPECTED_SUMS_SHA)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: lmpdf-draft-${{ github.run_id }}-${{ github.run_attempt }}
          path: draft-assets/*
          if-no-files-found: error

  qualify-macos-arm64:
    needs: candidate
    name: Qualify macos-arm64
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/qualify-platform
        with:
          artifact: ${{ needs.candidate.outputs.artifact }}
          host_asset: lmpdf-macos-arm64
          layout_asset: lmpdf-layout-macos-arm64
          name: macos-arm64
          python: python3

  integration:
    needs: [candidate, qualify-macos-arm64]
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - { os: macos-15-intel, name: macos-x64, host: lmpdf-macos-x64, layout: lmpdf-layout-macos-x64, python: python3 }
          - { os: ubuntu-24.04, name: linux-x64, host: lmpdf-linux-x64, layout: lmpdf-layout-linux-x64, python: python3 }
          - { os: ubuntu-24.04-arm, name: linux-arm64, host: lmpdf-linux-arm64, layout: lmpdf-layout-linux-arm64, python: python3 }
          - { os: windows-2022, name: windows-x64, host: lmpdf-windows-x64.exe, layout: lmpdf-layout-windows-x64.exe, python: python }
    name: Qualify ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/qualify-platform
        with:
          artifact: ${{ needs.candidate.outputs.artifact }}
          host_asset: ${{ matrix.host }}
          layout_asset: ${{ matrix.layout }}
          name: ${{ matrix.name }}
          python: ${{ matrix.python }}

  replay-macos-arm64:
    needs: [candidate, qualify-macos-arm64]
    name: Replay macos-arm64
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.candidate.outputs.artifact }}
          path: draft-assets
      - name: Install pinned lmscript compiler
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/compiler" --no-save --package-lock=false @lmctl-ai/lmctl@0.2.458
          echo "LMSCRIPT_BIN=$RUNNER_TEMP/compiler/node_modules/.bin/lmscript" >> "$GITHUB_ENV"
          echo "LMCODE_COMPILER_MODULE=$RUNNER_TEMP/compiler/node_modules/@lmctl-ai/lmctl/dist/dsl.js" >> "$GITHUB_ENV"
      - name: Stage the exact draft host
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_TAG: ${{ needs.candidate.outputs.tag }}
        run: python3 scripts/install-draft-host.py --compiler "$RUNNER_TEMP/compiler/node_modules/.bin/lmscript" --tag "$DRAFT_TAG" --asset lmpdf-macos-arm64 --candidate draft-assets
      - name: Compare independent PDF output hashes
        run: python3 scripts/conformance.py --binary "$LMPDF_BIN" --out-dir "$RUNNER_TEMP/lmpdf-replay" --render-only

  replay:
    needs: [candidate, qualify-macos-arm64]
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - { os: macos-15-intel, name: macos-x64, host: lmpdf-macos-x64, python: python3 }
          - { os: ubuntu-24.04, name: linux-x64, host: lmpdf-linux-x64, python: python3 }
          - { os: ubuntu-24.04-arm, name: linux-arm64, host: lmpdf-linux-arm64, python: python3 }
          - { os: windows-2022, name: windows-x64, host: lmpdf-windows-x64.exe, python: python }
    name: Replay ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.candidate.outputs.artifact }}
          path: draft-assets
      - name: Install pinned lmscript compiler
        shell: bash
        env:
          PYTHON: ${{ matrix.python }}
        run: |
          npm install --prefix "$RUNNER_TEMP/compiler" --no-save --package-lock=false @lmctl-ai/lmctl@0.2.458
          compiler="$RUNNER_TEMP/compiler/node_modules/.bin/lmscript"
          if [[ "$RUNNER_OS" == Windows ]]; then compiler="$compiler.cmd"; fi
          echo "LMSCRIPT_BIN=$compiler" >> "$GITHUB_ENV"
          echo "LMCODE_COMPILER_MODULE=$RUNNER_TEMP/compiler/node_modules/@lmctl-ai/lmctl/dist/dsl.js" >> "$GITHUB_ENV"
          echo "LMPDF_TEST_PYTHON=$PYTHON" >> "$GITHUB_ENV"
      - name: Stage the exact draft host
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_TAG: ${{ needs.candidate.outputs.tag }}
          HOST_ASSET: ${{ matrix.host }}
          PYTHON: ${{ matrix.python }}
        run: |
          "$PYTHON" scripts/install-draft-host.py --compiler "$LMSCRIPT_BIN" --tag "$DRAFT_TAG" --asset "$HOST_ASSET" --candidate draft-assets
      - name: Compare independent PDF output hashes
        shell: bash
        run: |
          "$LMPDF_TEST_PYTHON" scripts/conformance.py --binary "$LMPDF_BIN" --out-dir "$RUNNER_TEMP/lmpdf-replay" --render-only

  compatibility:
    needs: [candidate, qualify-macos-arm64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.candidate.outputs.artifact }}
          path: draft-assets
      - name: Install current and historical compiler versions
        run: |
          npm install --prefix "$RUNNER_TEMP/compiler" --no-save --package-lock=false @lmctl-ai/lmctl@0.2.458
          npm install --prefix "$RUNNER_TEMP/compiler-v5" --no-save --package-lock=false @lmctl-ai/lmctl@0.2.420
          echo "LMSCRIPT_BIN=$RUNNER_TEMP/compiler/node_modules/.bin/lmscript" >> "$GITHUB_ENV"
          echo "LMCODE_COMPILER_MODULE=$RUNNER_TEMP/compiler/node_modules/@lmctl-ai/lmctl/dist/dsl.js" >> "$GITHUB_ENV"
      - name: Install the exact draft candidate
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_TAG: ${{ needs.candidate.outputs.tag }}
        run: |
          python3 scripts/install-draft-host.py --compiler "$LMSCRIPT_BIN" --tag "$DRAFT_TAG" --asset lmpdf-linux-x64 --candidate draft-assets
      - name: Compare five same-input operations with the legacy public host
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/before"
          gh release download v0.1.62 -R lmctl-ai/lmpdf --pattern lmpdf-linux-x64 --pattern SHA256SUMS --dir "$RUNNER_TEMP/before"
          (cd "$RUNNER_TEMP/before" && sha256sum --check --ignore-missing SHA256SUMS)
          chmod +x "$RUNNER_TEMP/before/lmpdf-linux-x64"
          python3 tests/protocol-runtime.py --binary "$LMPDF_BIN" --before-binary "$RUNNER_TEMP/before/lmpdf-linux-x64" --before-compiler "$RUNNER_TEMP/compiler-v5/node_modules/.bin/lmscript" --skip-example certificate.lms

  conformance:
    needs: [candidate, qualify-macos-arm64, integration, replay-macos-arm64, replay, compatibility]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y qpdf poppler-utils mupdf-tools default-jre-headless
          scripts/install-verapdf.sh "$PWD/.tools/verapdf"
          scripts/install-poppler.sh "$PWD/.tools/poppler"
          echo "$PWD/.tools/poppler/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.candidate.outputs.artifact }}
          path: draft-assets
      - name: Install pinned lmscript compiler
        run: |
          npm install --prefix "$RUNNER_TEMP/compiler" --no-save --package-lock=false @lmctl-ai/lmctl@0.2.458
          echo "LMSCRIPT_BIN=$RUNNER_TEMP/compiler/node_modules/.bin/lmscript" >> "$GITHUB_ENV"
          echo "LMCODE_COMPILER_MODULE=$RUNNER_TEMP/compiler/node_modules/@lmctl-ai/lmctl/dist/dsl.js" >> "$GITHUB_ENV"
      - name: Install the exact candidate host
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_TAG: ${{ needs.candidate.outputs.tag }}
        run: python3 scripts/install-draft-host.py --compiler "$LMSCRIPT_BIN" --tag "$DRAFT_TAG" --asset lmpdf-linux-x64 --candidate draft-assets
      - name: Run archival accessibility and deterministic content checks
        run: python3 scripts/conformance.py --binary "$LMPDF_BIN" --out-dir conformance-output --verapdf "$PWD/.tools/verapdf/verapdf"
      - name: Run tagged and untagged 200-page RSS budgets
        run: python3 scripts/benchmark-release.py --binary "$LMPDF_BIN" --platform linux-x64 --output-dir benchmark-output

  deliberate-failure-test:
    needs: [candidate, qualify-macos-arm64, integration, replay-macos-arm64, replay, compatibility, conformance]
    if: ${{ needs.candidate.outputs.failure_control == 'true' && needs.integration.result == 'success' && needs.replay-macos-arm64.result == 'success' && needs.replay.result == 'success' && needs.compatibility.result == 'success' && needs.conformance.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Run the deliberate public failure-path test
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## Deliberate public qualification failure

          The five-platform host integration and public release gates passed. This throwaway dispatch now fails one test so the draft retention and no-promotion path can be verified.
          SUMMARY
          python3 - <<'PY'
          import unittest
          class FailurePathTest(unittest.TestCase):
              def test_public_draft_is_not_promoted_after_a_test_failure(self):
                  self.fail("deliberate public draft qualification failure")
          unittest.main()
          PY

  promote:
    needs: [candidate, qualify-macos-arm64, integration, replay-macos-arm64, replay, compatibility, conformance, deliberate-failure-test]
    if: ${{ always() && needs.candidate.result == 'success' && needs.qualify-macos-arm64.result == 'success' && needs.integration.result == 'success' && needs.replay-macos-arm64.result == 'success' && needs.replay.result == 'success' && needs.compatibility.result == 'success' && needs.conformance.result == 'success' && (needs.deliberate-failure-test.result == 'success' || needs.deliberate-failure-test.result == 'skipped') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.candidate.outputs.artifact }}
          path: draft-assets
      - name: Promote only the tested, unchanged draft
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_TAG: ${{ needs.candidate.outputs.tag }}
          EXPECTED_SUMS_SHA: ${{ github.event.client_payload.sha256sums_sha256 }}
        run: python3 scripts/manage-qualified-draft.py promote "$DRAFT_TAG" "$EXPECTED_SUMS_SHA" draft-assets

  cleanup-throwaway-draft:
    needs: [candidate, qualify-macos-arm64, integration, replay-macos-arm64, replay, compatibility, conformance, deliberate-failure-test]
    if: ${{ always() && needs.candidate.result == 'success' && needs.qualify-macos-arm64.result == 'success' && needs.integration.result == 'success' && needs.replay-macos-arm64.result == 'success' && needs.replay.result == 'success' && needs.compatibility.result == 'success' && needs.conformance.result == 'success' && needs.deliberate-failure-test.result == 'failure' && needs.candidate.outputs.failure_control == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.candidate.outputs.artifact }}
          path: draft-assets
      - name: Verify the throwaway stayed a draft, then remove only that release
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_TAG: ${{ needs.candidate.outputs.tag }}
          EXPECTED_SUMS_SHA: ${{ github.event.client_payload.sha256sums_sha256 }}
        run: python3 scripts/manage-qualified-draft.py cleanup "$DRAFT_TAG" "$EXPECTED_SUMS_SHA" draft-assets
